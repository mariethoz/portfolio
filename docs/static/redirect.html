<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checking link…</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 2rem;
        }
    </style>
</head>
<body>

<h2>Checking link…</h2>
<p id="status">Please wait.</p>

<script>
    function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
    }

    const target = getParam("to");
    const status = document.getElementById("status");

    if (!target) {
        status.textContent = "No link provided.";
    } else {
        status.textContent = "Testing link: " + target;
        setTimeout(() => {
            window.location.href = target;
        }, 2000); // 2000 ms = 2 seconds

        fetch(target, { method: "HEAD" })
            .then(res => {
                if (res.ok) {
                    status.textContent = "Link is valid. Redirecting…";
                    window.location.href = target;
                } else {
                    status.textContent = `This link appears to be broken (status ${res.status}).`;
                }
            })
            .catch(() => {
                status.textContent = "This link is unreachable right now.";
            });
    }
</script>

</body>
</html>
